name: Validate and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Offline validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile cf_ip_finder.py cf_ip_tester_legacy.py
      - name: Built-in self-test
        run: python cf_ip_finder.py --self-test
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check version consistency
        run: python tests/check_version.py

  release:
    name: Build Windows EXE and publish GitHub Release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read and validate release version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          $expected = "release: v$version"
          if (-not "${{ github.event.head_commit.message }}".StartsWith($expected)) {
            throw "Commit message must start with '$expected'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build one-file Windows GUI
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name CF-IP-Finder-${{ steps.meta.outputs.version }}
          --hidden-import cf_ip_tester_legacy cf_ip_finder.py
      - name: Create source archive and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "CF-IP-Finder-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $include = @(
            "cf_ip_finder.py", "cf_ip_tester_legacy.py", "VERSION", "requirements.txt",
            "run.bat", "build_exe.bat", "README.md", "README_CN.md", "CHANGELOG_CN.md",
            "AI_BOOTSTRAP_PROMPT.md", "AI_DEVELOPMENT_PROTOCOL.md", "SESSION_HANDOFF.md",
            "REFACTOR_ROADMAP.md", "dev_log.md", ".gitignore", "docs", "tests", ".github"
          )
          foreach ($item in $include) {
            if (Test-Path $item) { Copy-Item -Path $item -Destination $stage -Recurse -Force }
          }
          $sourceZip = "dist/CF-IP-Finder-$version-Source.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $sourceZip -Force
          $exeDest = "dist/CF-IP-Finder-$version-Windows-x64.exe"
          Copy-Item "dist/CF-IP-Finder-$version.exe" $exeDest -Force
          $hashExe = (Get-FileHash $exeDest -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLower()
          @(
            "$hashExe  $(Split-Path $exeDest -Leaf)",
            "$hashZip  $(Split-Path $sourceZip -Leaf)"
          ) | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CF IP Finder v${{ steps.meta.outputs.version }}
          body_path: RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md
          generate_release_notes: true
          files: |
            dist/CF-IP-Finder-${{ steps.meta.outputs.version }}-Windows-x64.exe
            dist/CF-IP-Finder-${{ steps.meta.outputs.version }}-Source.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
